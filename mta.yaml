_schema-version: 3.3.0
ID: flight-cap-demo
description: A simple CAP project.
version: 1.0.0
modules:
# Single CAP app: serves the OData service (in-memory SQLite with CSV mock data)
# and the Fiori UI from app/flightsop/webapp. No login, no cloud database.
- name: flight-cap-demo-srv
  type: nodejs
  path: gen/srv
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
    memory: 256M
    disk-quota: 1024M
  build-parameters:
    builder: npm-ci
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
    - mkdir -p gen/srv/srv/data gen/srv/app/flightsop
    - cp -r db/data/. gen/srv/srv/data/
    - cp -r app/flightsop/webapp gen/srv/app/flightsop/
